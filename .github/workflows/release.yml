---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  galaxy:
    name: Import to Ansible Galaxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5

      - name: Install ansible-core
        run: uv pip install --python .venv/bin/python ansible-core

      - name: Import role to Ansible Galaxy
        run: >-
          .venv/bin/ansible-galaxy role import
          --token "${{ secrets.galaxy_api_key }}"
          --role-name oauth2_proxy
          zekker6 ansible-role-oauth2-proxy
