---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  galaxy:
    name: Import to Ansible Galaxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install ansible-core
        run: uv pip install --python .venv/bin/python ansible-core

      - name: Import role to Ansible Galaxy
        run: >-
          .venv/bin/ansible-galaxy role import
          --token "${{ secrets.galaxy_api_key }}"
          --role-name oauth2_proxy
          zekker6 ansible-role-oauth2-proxy
