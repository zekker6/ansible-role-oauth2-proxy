---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: oauth2-proxy-${MOLECULE_DISTRO:-debian13}
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      # Mirror the upcoming ansible-core 2.24 default so tests fail loudly if the
      # role ever reintroduces injected fact vars (e.g. ansible_architecture)
      # instead of the ansible_facts namespace.
      inject_facts_as_vars: false
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    host_vars:
      oauth2-proxy-rockylinux9:
        ansible_become_method: su
verifier:
  name: ansible
