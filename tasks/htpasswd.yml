---
- name: Validate htpasswd entries are pre-hashed
  ansible.builtin.assert:
    that:
      - item.username is defined
      - item.hashed_password is defined
      - item.hashed_password is string
      - item.hashed_password | length > 0
    fail_msg: >-
      Each oauth2_proxy_htpasswd_users entry needs 'username' and a pre-hashed
      'hashed_password' (e.g. from `htpasswd -nbB <user> <password>`).
      Plaintext passwords are not supported.
    quiet: true
  loop: "{{ oauth2_proxy_htpasswd_users }}"
  loop_control:
    label: "{{ item.username | default('?') }}"

- name: Generate htpasswd file
  ansible.builtin.template:
    src: htpasswd.j2
    dest: "{{ oauth2_proxy_htpasswd_file }}"
    owner: "{{ oauth2_proxy_user }}"
    group: "{{ oauth2_proxy_group }}"
    mode: "0640"
  no_log: true
  notify: Restart oauth2-proxy
