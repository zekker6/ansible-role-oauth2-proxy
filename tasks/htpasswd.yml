---
- name: Validate htpasswd entries are well-formed and pre-hashed
  ansible.builtin.assert:
    that:
      - item.username is defined
      - item.username is string
      - item.username | length > 0
      - item.username is not search('[:\s]')
      - item.hashed_password is defined
      - item.hashed_password is string
      - item.hashed_password is match(oauth2_proxy_htpasswd_hash_regex)
    fail_msg: >-
      Invalid oauth2_proxy_htpasswd_users entry for
      '{{ item.username | default('?') }}'. 'username' must be a non-empty string
      without a colon or whitespace, and 'hashed_password' must be a pre-hashed
      bcrypt ($2a$/$2b$/$2y$) or SHA ({SHA}...) value (e.g. from
      `htpasswd -nbB <user> <password>`). Plaintext passwords are not supported.
    quiet: true
  vars:
    # Anchored at the end with \Z; match() anchors the start. bcrypt is
    # $2[aby]$<cost>$<22 salt + 31 hash>; SHA is {SHA}<base64 sha1>.
    oauth2_proxy_htpasswd_hash_regex: >-
      (\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}|\{SHA\}[A-Za-z0-9+/]{27}=)\Z
  loop: "{{ oauth2_proxy_htpasswd_users }}"
  loop_control:
    label: "{{ item.username | default('?') }}"

- name: Generate htpasswd file
  ansible.builtin.template:
    src: htpasswd.j2
    dest: "{{ oauth2_proxy_htpasswd_file }}"
    owner: root
    group: "{{ oauth2_proxy_group }}"
    mode: "0640"
  no_log: true
  notify: Restart oauth2-proxy
