version: "3"

vars:
  # Tools live in the mise-managed project virtualenv. Call them explicitly so
  # global mise shims / ~/.local/bin tools can never shadow them.
  VENV_BIN: .venv/bin
  # Distro matrix for the :all targets. Keep in sync with the matrix in
  # .github/workflows/test.yml.
  DISTROS: debian13 ubuntu2404 rockylinux9

tasks:
  deps:
    desc: Install Python dependencies and test collections into the project venv
    cmds:
      - uv pip install --python {{.VENV_BIN}}/python -r requirements.txt
      - "{{.VENV_BIN}}/ansible-galaxy collection install -r requirements.yml"
    status:
      - test -x {{.VENV_BIN}}/yamllint
      - test -x {{.VENV_BIN}}/ansible-lint
      - test -x {{.VENV_BIN}}/molecule
      - "{{.VENV_BIN}}/ansible-galaxy collection list 2>/dev/null | grep -qi '^community.docker '"

  lint:
    desc: Run yamllint and ansible-lint
    deps: [deps]
    cmds:
      - "{{.VENV_BIN}}/yamllint ."
      - "{{.VENV_BIN}}/ansible-lint ."

  test:
    desc: Run the full molecule test sequence (set MOLECULE_DISTRO to pick a distro)
    deps: [deps]
    cmds:
      - "{{.VENV_BIN}}/molecule test"

  test:distro:
    desc: Run the molecule sequence for a single distro (set DISTRO=<name>)
    requires:
      vars: [DISTRO]
    cmds:
      - task: molecule:distro
        vars: { DISTRO: "{{.DISTRO}}" }

  test:all:
    desc: Run the molecule sequence across every CI distro in parallel (native for fan-out)
    deps:
      - for: { var: DISTROS }
        task: molecule:distro
        vars:
          DISTRO: "{{.ITEM}}"

  molecule:converge:
    desc: Create and converge the molecule instance
    deps: [deps]
    cmds:
      - "{{.VENV_BIN}}/molecule converge"

  molecule:verify:
    desc: Run molecule verification against the converged instance
    deps: [deps]
    cmds:
      - "{{.VENV_BIN}}/molecule verify"

  # Shared primitive: run one molecule subcommand for a single distro with
  # isolated ephemeral state (inventory, state.yml), so concurrent runs of the
  # shared "default" scenario do not clobber each other. CMD defaults to the
  # full "test" sequence; test:all and molecule:destroy fan this out per distro.
  molecule:distro:
    deps: [deps]
    requires:
      vars: [DISTRO]
    vars:
      CMD: '{{.CMD | default "test"}}'
    env:
      MOLECULE_DISTRO: "{{.DISTRO}}"
      MOLECULE_EPHEMERAL_DIRECTORY: "{{.ROOT_DIR}}/.cache/molecule/{{.DISTRO}}"
    cmds:
      - "{{.VENV_BIN}}/molecule {{.CMD}}"

  molecule:destroy:
    desc: Destroy the molecule instance across every CI distro in parallel (native for fan-out)
    deps:
      - for: { var: DISTROS }
        task: molecule:distro
        vars:
          DISTRO: "{{.ITEM}}"
          CMD: destroy
